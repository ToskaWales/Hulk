.close-hint{margin-top:10px;padding:8px 20px;background:transparent;border:1px solid #333;

const pillars=[
  {icon:"🥩",title:"Hulk Diet",color:"#f87171",items:["300–500 cal surplus above maintenance","1.2g protein per lb of bodyweight","25–30% calories from healthy fats (eggs, avocados, olive oil)","Post-workout: 50–100g fast carbs (Cream of Rice, fruit)"]},
  {icon:"⚗️",title:"Supplement Stack",color:"#60a5fa",items:["Creatine Monohydrate — 5g daily","Vitamin D3 + K2 — 5000 IU daily","ZMA (Zinc & Magnesium) — before bed","Ashwagandha KSM-66 — 600mg daily"]},
  {icon:"🛌",title:"Recovery Rules",color:"#34d399",items:["8 hours sleep — non-negotiable","No cold plunge post-lift (stunts hypertrophy)","Cold exposure in morning or rest days only","T-levels can drop 10–15% with only 6hrs sleep"]},
  {icon:"📈",title:"Progressive Overload",color:"#facc15",items:["Add 2.5kg to the bar each week, OR","Do 1 more rep than last week, OR","Decrease rest time by 10 seconds","No strength gain in 3 months = just eating, not bulking"]},
];

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let state={tab:"workout",phase:"phase2",day:"monday",done:{},pillar:0,log:{}};

function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem("hulk_v3")||"{}");
    if(s.done) state.done=s.done;
    if(s.log)  state.log=s.log;
    if(s.phase) state.phase=s.phase;
    if(s.day)   state.day=s.day;
  }catch(e){}
}
function save(){
  localStorage.setItem("hulk_v3",JSON.stringify({done:state.done,log:state.log,phase:state.phase,day:state.day}));
}

// ─────────────────────────────────────────────────────────────────────────────
// WEIGHT HELPERS
// ─────────────────────────────────────────────────────────────────────────────
const today=()=>new Date().toISOString().slice(0,10);
const round25=(v)=>Math.round(v*4)/4; // round to nearest 0.25

function getLog(name){return state.log[name]||[];}
function getLastEntry(name){const l=getLog(name);return l.length?l[l.length-1]:null;}
function getLastWeight(name){const e=getLastEntry(name);return e?e.weight:null;}
function getTarget(name){const lw=getLastWeight(name);return lw!==null?round25(lw+2.5):null;}
function todayLogged(name){const l=getLog(name);return l.length&&l[l.length-1].date===today();}

function logWeight(name,weight){
  if(!state.log[name]) state.log[name]=[];
  const l=state.log[name];
  const t=today();
  if(l.length&&l[l.length-1].date===t) l[l.length-1].weight=weight;
  else l.push({date:t,weight});
  save();
}

function fmtDate(ds){
  const d=new Date(ds+"T00:00:00");
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

// ─────────────────────────────────────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────────────────────────────────────
let _modalName=null;

function openModal(name,sets){
  _modalName=name;
  const last=getLastWeight(name);
  const target=getTarget(name);
  document.getElementById("modal-ex-name").textContent=name;
  document.getElementById("modal-ex-sets").textContent=sets;
  const inp=document.getElementById("modal-val");
  // Pre-fill with target if available, else last, else 20
  inp.value=target!==null?target:(last!==null?last:20);
  const hint=document.getElementById("modal-hint");
  if(target!==null){
    const le=getLastEntry(name);
    hint.innerHTML=`Target: <strong>${target}kg</strong> (+2.5 from ${last}kg on ${fmtDate(le.date)})`;
  } else {
    hint.innerHTML=`<strong style="color:#facc15">First session</strong> — enter your starting weight`;
  }
  document.getElementById("modal-overlay").classList.add("open");
  setTimeout(()=>inp.select&&inp.select(),300);
}

function adjustModal(d){
  const el=document.getElementById("modal-val");
  el.value=Math.max(0,round25((parseFloat(el.value)||0)+d));
}

function saveModal(){
  const v=parseFloat(document.getElementById("modal-val").value);
  if(isNaN(v)||v<0) return;
  logWeight(_modalName,v);
  closeModal();
  render();
}

function closeModal(){
  document.getElementById("modal-overlay").classList.remove("open");
  _modalName=null;
}

function handleOverlayClick(e){if(e.target.id==="modal-overlay") closeModal();}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function checkSVG(c){return`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>`;}
function boltSVG(c){return`<svg width="13" height="13" viewBox="0 0 24 24" fill="${c}"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`;}
function esc(s){return s.replace(/'/g,"\\'");}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER: WORKOUT
// ─────────────────────────────────────────────────────────────────────────────
function renderWorkout(){
  const phase=phases[state.phase];
  const days=phase.days;
  const day=days.find(d=>d.id===state.day)||days[0];

  const done=day.exercises.filter((_,i)=>state.done[`${day.id}-${i}`]).length;
  const total=day.exercises.length;
  const pct=Math.round((done/total)*100);

  const phaseHTML=`<div class="phase-toggle">${Object.entries(phases).map(([k,p])=>`
    <button class="phase-btn ${state.phase===k?'active':''}" onclick="setPhase('${k}')">
      <div class="pb-label">${p.label}</div><div class="pb-weeks">${p.weeks}</div><div class="pb-sub">${p.subtitle}</div>
    </button>`).join('')}</div>`;

  const tabHTML=`<div class="day-tabs">${days.map(d=>`
    <button class="day-tab" style="background:${state.day===d.id?d.color:'transparent'};color:${state.day===d.id?'#000':'#555'};border-color:${state.day===d.id?d.color:'#2a2a2a'}" onclick="setDay('${d.id}')">
      ${d.label.split(' / ')[0]}
    </button>`).join('')}</div>`;

  const exercisesHTML=day.exercises.map((ex,i)=>{
    const key=`${day.id}-${i}`;
    const isDone=!!state.done[key];
    const lastW=ex.w?getLastWeight(ex.name):null;
    const targetW=ex.w?getTarget(ex.name):null;
    const todayW=ex.w&&todayLogged(ex.name)?getLastEntry(ex.name).weight:null;

    // Overload suggestion strip
    let suggestHTML='';
    if(ex.w && targetW!==null && !todayLogged(ex.name)){
      suggestHTML=`<div class="overload-suggest">
        <span style="font-size:15px">⚡</span>
        <div class="os-text"><strong>${targetW}kg target</strong>+2.5kg from last: ${lastW}kg</div>
        <button class="os-apply" onclick="quickApply('${esc(ex.name)}',${targetW})">Apply</button>
      </div>`;
    }

    // Badge
    let badge='';
    if(ex.w){
      if(todayW!==null) badge=`<span class="wt-badge up">✓ ${todayW}kg</span>`;
      else if(lastW!==null) badge=`<span class="wt-badge same">Last: ${lastW}kg</span>`;
      else badge=`<span class="wt-badge new-ex">NEW</span>`;
    }

    // Weight row
    const weightHTML=ex.w?`
      <div class="weight-track">
        <span class="wt-label">Weight</span>
        <div class="wt-row">
          <button class="wt-btn" onclick="bumpWeight('${esc(ex.name)}',-2.5,'${esc(ex.sets)}')" style="color:${day.color}">−</button>
          <input class="wt-val" type="number" step="0.5" min="0"
            value="${todayW!==null?todayW:(lastW!==null?lastW:'')}"
            placeholder="—"
            onclick="event.stopPropagation();openModal('${esc(ex.name)}','${esc(ex.sets)}')"
            readonly/>
          <span class="wt-unit">kg</span>
          <button class="wt-btn" onclick="bumpWeight('${esc(ex.name)}',2.5,'${esc(ex.sets)}')" style="color:${day.color}">+</button>
          ${badge}
        </div>
      </div>` : '';

    return `<div class="exercise-wrap">
      ${suggestHTML}
      <button class="exercise-row ${isDone?'done':''}" style="${isDone?`background:${day.color}0d`:''}" onclick="toggleEx('${day.id}',${i})">
        <div class="ex-check" style="color:${isDone?day.color:'#2a2a2a'}">${checkSVG(isDone?day.color:'#2a2a2a')}</div>
        <div style="flex:1;min-width:0">
          <div class="ex-name ${isDone?'done':''}">${ex.name}</div>
          ${ex.note?`<div class="ex-note">${ex.note}</div>`:''}
        </div>
        <div class="ex-sets-label ${isDone?'done':''}" style="color:${day.color}">${ex.sets}</div>
      </button>
      ${weightHTML}
    </div>`;
  }).join('');

  const condHTML=day.conditioning?`<div class="conditioning-block" style="border:1px solid ${day.color}30">
    <div class="cond-header">${boltSVG(day.color)}<span class="cond-label" style="color:${day.color}">Conditioning</span></div>
    <div class="cond-title">${day.conditioning.title}</div>
    ${day.conditioning.items.map(item=>`<div class="cond-item" style="border-left:2px solid ${day.color}40">${item}</div>`).join('')}
  </div>`:'';

  const dayHTML=`<div class="day-card">
    <div class="day-header" style="background:linear-gradient(135deg,${day.color}12 0%,transparent 60%)">
      <div class="day-header-inner">
        <div>
          <div class="day-label">${day.label}</div>
          <div class="day-title">${day.title}</div>
          <div class="day-tag" style="color:${day.color}">${day.tag}</div>
        </div>
        <div class="progress-ring-wrap">
          <div class="progress-ring" style="background:conic-gradient(${day.color} ${pct*3.6}deg,#1f1f1f 0deg)">
            <div class="progress-ring-inner" style="color:${pct===100?day.color:'#fff'}">${pct}%</div>
          </div>
          <div class="progress-ring-count">${done}/${total}</div>
        </div>
      </div>
    </div>
    <div class="exercise-list">${exercisesHTML}</div>
    ${condHTML}
  </div>`;

  const p=pillars[state.pillar];
  const pillarsHTML=`<div class="pillars-section">
    <div class="pillars-eyebrow">Beast Growth Pillars</div>
    <div class="pillar-tabs">${pillars.map((pl,i)=>`
      <button class="pillar-tab" style="background:${state.pillar===i?pl.color:'transparent'};color:${state.pillar===i?'#000':'#555'};border-color:${state.pillar===i?pl.color:'#2a2a2a'}" onclick="setPillar(${i})">${pl.icon}</button>`).join('')}
    </div>
    <div class="pillar-card" style="border-left:3px solid ${p.color}">
      <div class="pillar-card-title">${p.icon} ${p.title}</div>
      ${p.items.map(item=>`<div class="pillar-item"><div class="pillar-dot" style="color:${p.color}">◆</div><div class="pillar-text">${item}</div></div>`).join('')}
    </div>
  </div>`;

  const overloadHTML=`<div class="overload-bar">
    <span class="overload-icon">⚡</span>
    <div><div class="overload-title">PROGRESSIVE OVERLOAD RULE</div>
    <div class="overload-sub">Every week: +2.5kg · or +1 rep · or −10s rest. Pick one. Always move forward.</div></div>
  </div>`;

  document.getElementById("scroll-body").innerHTML=phaseHTML+tabHTML+dayHTML+pillarsHTML+overloadHTML;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER: HISTORY
// ─────────────────────────────────────────────────────────────────────────────
function renderHistory(){
  const log=state.log;
  const names=Object.keys(log).filter(k=>log[k].length>0);

  if(!names.length){
    document.getElementById("scroll-body").innerHTML=`
      <div class="history-header"><div class="history-title">Weight History</div>
      <div class="history-sub">Track every session. Watch yourself grow.</div></div>
      <div class="history-empty"><span>🏋️</span>No weights logged yet.<br/>Head to a workout and log your weights.</div>`;
    return;
  }

  // Sort by most recently logged
  names.sort((a,b)=>{
    const la=log[a].slice(-1)[0].date, lb=log[b].slice(-1)[0].date;
    return lb.localeCompare(la);
  });

  const cards=names.map(name=>{
    const entries=[...log[name]].sort((a,b)=>a.date.localeCompare(b.date));
    const latest=entries[entries.length-1];
    const prev=entries.length>1?entries[entries.length-2]:null;
    const target=round25(latest.weight+2.5);
    const diff=prev?round25(latest.weight-prev.weight):null;

    // Mini sparkline (last 6)
    const spark=entries.slice(-6);
    const maxW=Math.max(...spark.map(e=>e.weight));
    const minW=Math.min(...spark.map(e=>e.weight));
    const range=maxW-minW||1;
    const sparkHTML=spark.length>1?`<div class="hist-chart">${spark.map((e,i)=>{
      const h=Math.max(10,((e.weight-minW)/range)*100);
      const isLast=i===spark.length-1;
      return `<div class="hist-bar-wrap"><div class="hist-bar" style="height:${h}%;background:${isLast?'#4ade80':'#2a2a2a'};width:100%"></div></div>`;
    }).join('')}</div>`:'';

    // Delta badge
    let deltaHTML='';
    if(diff!==null){
      if(diff>0) deltaHTML=`<span class="hist-delta up">+${diff.toFixed(1)}kg ↑</span>`;
      else if(diff<0) deltaHTML=`<span class="hist-delta down">${diff.toFixed(1)}kg ↓</span>`;
      else deltaHTML=`<span class="hist-delta flat">→ no change</span>`;
    }

    // Last 5 entries (newest first)
    const recent=entries.slice(-5).reverse();
    const entryRows=recent.map((e,i)=>{
      const prevE=i<recent.length-1?recent[i+1]:null;
      let rowDelta='';
      if(prevE){
        const d=round25(e.weight-prevE.weight);
        if(d>0) rowDelta=`<span class="hist-delta up">+${d.toFixed(1)}</span>`;
        else if(d<0) rowDelta=`<span class="hist-delta down">${d.toFixed(1)}</span>`;
      }
      return `<div class="hist-entry">
        <span class="hist-date">${fmtDate(e.date)}</span>
        <span class="hist-weight-val" style="color:${i===0?'#fff':'#777'}">${e.weight}kg</span>
        ${rowDelta}
      </div>`;
    }).join('');

    return `<div class="hist-card">
      <div class="hist-card-head">
        <div>
          <div class="hist-ex-name">${name}</div>
          <div class="hist-sessions">${entries.length} session${entries.length>1?'s':''} · ${deltaHTML||'first session'}</div>
        </div>
        <div class="hist-target">
          <div class="hist-target-label">Next target</div>
          <div class="hist-target-val">${target}kg</div>
          <div class="hist-target-note">+2.5kg overload</div>
        </div>
      </div>
      ${sparkHTML}
      <div class="hist-entries">
        ${entryRows}
        ${entries.length>5?`<div style="font-size:11px;color:#444;font-family:monospace;padding:8px 16px">+${entries.length-5} earlier sessions</div>`:''}
      </div>
    </div>`;
  }).join('');

  document.getElementById("scroll-body").innerHTML=`
    <div class="history-header">
      <div class="history-title">Weight History</div>
      <div class="history-sub">Progressive overload targets auto-calculated</div>
    </div>${cards}`;
}

// ─────────────────────────────────────────────────────────────────────────────
// ACTIONS
// ─────────────────────────────────────────────────────────────────────────────
function render(){state.tab==="workout"?renderWorkout():renderHistory();}

function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
  render();
}
function setPhase(k){state.phase=k;state.day=phases[k].days[0].id;save();render();}
function setDay(id){state.day=id;render();}
function toggleEx(dayId,i){const k=`${dayId}-${i}`;state.done[k]=!state.done[k];save();render();}
function setPillar(i){state.pillar=i;render();}

function quickApply(name,w){logWeight(name,w);render();}

function bumpWeight(name,delta,sets){
  const last=getLastWeight(name)||0;
  const nw=Math.max(0,round25(last+delta));
  logWeight(name,nw);
  render();
}

// ─────────────────────────────────────────────────────────────────────────────
// INSTALL
// ─────────────────────────────────────────────────────────────────────────────
let deferredPrompt=null;
const banner=document.getElementById('install-banner');
const iosHint=document.getElementById('ios-hint');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!localStorage.getItem('hulk_inst')) banner.classList.add('visible');});
document.getElementById('install-btn').addEventListener('click',async()=>{if(!deferredPrompt) return;deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;if(outcome==='accepted') localStorage.setItem('hulk_inst','1');banner.classList.remove('visible');deferredPrompt=null;});
document.getElementById('dismiss-btn').addEventListener('click',()=>{banner.classList.remove('visible');localStorage.setItem('hulk_inst','1');});
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(isIOS&&!window.navigator.standalone&&!localStorage.getItem('hulk_ios')) setTimeout(()=>iosHint.classList.add('visible'),2000);
document.getElementById('close-hint').addEventListener('click',()=>{iosHint.classList.remove('visible');localStorage.setItem('hulk_ios','1');});

// ─────────────────────────────────────────────────────────────────────────────
// SERVICE WORKER
// ─────────────────────────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  const sw=`const C='hulk-v3';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k))))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
loadState();
render();
</script>
