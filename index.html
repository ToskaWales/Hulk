*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

#app{max-width:680px;margin:0 auto;min-height:100vh;}

/* NAV */
.nav-tabs{display:flex;background:#0f0f0f;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:20;}
.nav-tab{flex:1;padding:13px 8px 11px;border:none;background:transparent;color:#444;
font-size:10px;letter-spacing:2px;font-family:monospace;font-weight:700;text-transform:uppercase;
cursor:pointer;transition:all .15s;border-bottom:2px solid transparent;}
.nav-tab.active{color:#4ade80;border-bottom-color:#4ade80;}

/* HEADER */
.header{border-bottom:1px solid #1f1f1f;padding:16px 20px 12px;background:linear-gradient(180deg,#0f0f0f 0%,#0a0a0a 100%);}
.header-eyebrow{display:flex;align-items:center;margin-bottom:3px;}
.eyebrow-text{font-size:10px;letter-spacing:4px;color:#555;text-transform:uppercase;font-family:monospace;}
.header-rule{flex:1;height:1px;background:#1f1f1f;margin-left:10px;}
.header h1{font-size:clamp(24px,7vw,42px);font-weight:900;letter-spacing:-1px;line-height:1;color:#fff;}
.header h1 span{color:#4ade80;}
.header-sub{margin-top:4px;font-size:11px;color:#555;font-family:monospace;letter-spacing:1px;}
.scroll-body{padding:0 16px 120px;}

/* PHASE + DAYS */
.phase-toggle{display:flex;gap:8px;margin:16px 0;}
.phase-btn{flex:1;padding:10px 12px;background:transparent;color:#555;border:1px solid #2a2a2a;
border-radius:6px;cursor:pointer;text-align:left;transition:all .15s;font-family:inherit;}
.phase-btn.active{background:#fff;color:#000;border-color:#fff;}
.pb-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;font-family:monospace;margin-bottom:2px;}
.pb-weeks{font-size:13px;font-weight:700;}
.pb-sub{font-size:10px;opacity:.7;margin-top:1px;}

.day-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:7px 12px;background:transparent;color:#555;border:1px solid #2a2a2a;
border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:2px;font-family:monospace;
font-weight:700;text-transform:uppercase;transition:all .15s;white-space:nowrap;}

/* DAY CARD */
.day-card{background:#111;border:1px solid #1f1f1f;border-radius:8px;overflow:hidden;margin-bottom:14px;}
.day-header{padding:16px 18px 12px;border-bottom:1px solid #1a1a1a;}
.day-header-inner{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.day-label{font-size:10px;letter-spacing:3px;color:#555;font-family:monospace;margin-bottom:3px;}
.day-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.5px;}
.day-tag{font-size:11px;margin-top:3px;font-family:monospace;}
.progress-ring-wrap{text-align:center;flex-shrink:0;}
.progress-ring{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.progress-ring-inner{width:34px;height:34px;border-radius:50%;background:#111;display:flex;
align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:monospace;color:#fff;}
.progress-ring-count{font-size:9px;color:#555;margin-top:3px;font-family:monospace;}

/* EXERCISE */
.exercise-list{padding:2px 0;}
.exercise-wrap{border-bottom:1px solid #161616;}
.exercise-wrap:last-child{border-bottom:none;}

.overload-suggest{padding:9px 14px;background:#4ade8010;border-bottom:1px solid #4ade8020;
display:flex;align-items:center;gap:10px;}
.os-text{flex:1;font-size:12px;color:#4ade80;line-height:1.4;}
.os-text strong{display:block;font-size:13px;font-family:monospace;}
.os-apply{padding:6px 12px;background:#4ade80;color:#000;border:none;border-radius:4px;
font-size:11px;font-weight:800;font-family:monospace;cursor:pointer;white-space:nowrap;flex-shrink:0;}

.exercise-row{width:100%;padding:11px 18px 9px;background:transparent;border:none;
cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;
transition:background .15s;font-family:inherit;}
.exercise-row.done{background:rgba(255,255,255,.02);}
.ex-check{flex-shrink:0;}
.ex-name{font-size:14px;font-weight:600;color:#e5e5e5;transition:all .15s;}
.ex-name.done{color:#555;text-decoration:line-through;}
.ex-note{font-size:11px;color:#444;margin-top:2px;font-style:italic;}
.ex-sets-label{font-size:11px;font-family:monospace;font-weight:700;flex-shrink:0;}
.ex-sets-label.done{opacity:.3;}

/* SET TRACKER */

.sets-header-row{display:flex;align-items:center;padding:0 2px 5px;border-bottom:1px solid #1a1a1a;margin-bottom:5px;}
.sh-set{font-size:9px;letter-spacing:2px;font-family:monospace;color:#444;text-transform:uppercase;width:36px;flex-shrink:0;}
.sh-kg{font-size:9px;letter-spacing:2px;font-family:monospace;color:#444;text-transform:uppercase;flex:1;text-align:center;}
.sh-reps{font-size:9px;letter-spacing:2px;font-family:monospace;color:#444;text-transform:uppercase;width:72px;text-align:center;flex-shrink:0;}
.sh-done{width:34px;flex-shrink:0;}

.set-row{display:flex;align-items:center;gap:6px;padding:4px 2px;border-radius:5px;margin-bottom:3px;transition:background .15s;}
.set-row.complete{background:#4ade8008;}
.set-num{font-size:11px;font-family:monospace;font-weight:700;width:36px;flex-shrink:0;color:#555;}
.set-num.wm{color:#444;font-style:italic;font-size:10px;}

.kg-input,.reps-input{background:#161616;border:1px solid #222;border-radius:5px;
color:#fff;font-size:15px;font-weight:700;font-family:monospace;text-align:center;
padding:7px 2px;outline:none;-webkit-appearance:none;appearance:none;
transition:border-color .15s,background .15s;}
.kg-input{flex:1;min-width:0;}
.reps-input{width:72px;flex-shrink:0;}
.kg-input:focus,.reps-input:focus{border-color:#4ade8060;background:#1a1a1a;}
.kg-input.done,.reps-input.done{border-color:#4ade8030;color:#4ade80;}
.kg-input::placeholder,.reps-input::placeholder{color:#2a2a2a;}

.set-tick{width:30px;height:30px;border-radius:50%;border:1px solid #222;
background:transparent;cursor:pointer;display:flex;align-items:center;
justify-content:center;flex-shrink:0;transition:all .15s;color:#333;font-size:13px;
padding:0;line-height:1;}
.set-tick.done{background:#4ade8020;border-color:#4ade8060;color:#4ade80;}
.set-tick:active{transform:scale(.88);}

.sets-summary{font-size:10px;font-family:monospace;color:#555;padding:4px 2px 0;display:flex;gap:10px;flex-wrap:wrap;}
.ss-chip{padding:2px 8px;background:#1a1a1a;border-radius:20px;color:#666;}
.ss-chip.best{color:#4ade80;background:#4ade8015;}

.conditioning-block{margin:0 14px 14px;padding:12px;background:#0d0d0d;border-radius:6px;}
.cond-header{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.cond-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-family:monospace;font-weight:700;}
.cond-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:7px;}
.cond-item{font-size:12px;color:#666;margin-bottom:3px;padding-left:10px;font-family:monospace;}

/* PILLARS */
.pillars-section{margin-top:24px;}
.pillars-eyebrow{font-size:10px;letter-spacing:4px;color:#555;font-family:monospace;text-transform:uppercase;margin-bottom:12px;}
.pillar-tabs{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.pillar-tabs::-webkit-scrollbar{display:none;}
.pillar-tab{flex-shrink:0;padding:9px 15px;background:transparent;color:#555;border:1px solid #2a2a2a;
border-radius:4px;cursor:pointer;font-size:16px;transition:all .15s;font-family:inherit;}
.pillar-card{background:#111;border:1px solid #1f1f1f;border-radius:8px;padding:16px;}
.pillar-card-title{font-size:15px;font-weight:800;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.pillar-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid #161616;}
.pillar-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.pillar-dot{margin-top:4px;flex-shrink:0;font-size:8px;}
.pillar-text{font-size:13px;color:#aaa;line-height:1.5;}
.overload-bar{margin-top:18px;padding:13px 16px;background:#0d0d0d;border:1px solid #1f1f1f;
border-radius:6px;display:flex;align-items:center;gap:10px;}
.overload-icon{font-size:17px;}
.overload-title{font-size:11px;font-weight:700;color:#facc15;font-family:monospace;letter-spacing:1px;}
.overload-sub{font-size:11px;color:#555;margin-top:2px;}

/* HISTORY */
.history-header{padding:18px 0 12px;}
.history-title{font-size:22px;font-weight:900;color:#fff;}
.history-sub{font-size:11px;color:#555;font-family:monospace;margin-top:4px;}
.history-empty{text-align:center;padding:60px 20px;color:#444;font-size:14px;line-height:2;}
.history-empty span{display:block;font-size:36px;margin-bottom:12px;}

.hist-card{background:#111;border:1px solid #1f1f1f;border-radius:8px;margin-bottom:10px;overflow:hidden;}
.hist-card-head{padding:12px 14px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.hist-ex-name{font-size:14px;font-weight:700;color:#fff;line-height:1.3;}
.hist-sessions{font-size:10px;letter-spacing:2px;font-family:monospace;color:#555;margin-top:2px;}
.hist-target{text-align:right;flex-shrink:0;}
.hist-target-label{font-size:9px;letter-spacing:2px;font-family:monospace;color:#555;text-transform:uppercase;}
.hist-target-val{font-size:18px;font-weight:900;font-family:monospace;color:#4ade80;}
.hist-target-note{font-size:10px;color:#555;font-family:monospace;}

.hist-chart{height:40px;display:flex;align-items:flex-end;gap:3px;padding:0 14px 0;margin-bottom:2px;}
.hist-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;}
.hist-bar{width:100%;border-radius:2px 2px 0 0;min-height:4px;}

.hist-entries{border-top:1px solid #161616;}
.hist-entry{padding:9px 14px;border-bottom:1px solid #0f0f0f;}
.hist-entry:last-child{border-bottom:none;}
.hist-entry-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.hist-date{font-size:11px;font-family:monospace;color:#555;flex-shrink:0;}
.hist-weight-val{font-size:14px;font-weight:700;font-family:monospace;}
.hist-delta{font-size:11px;font-family:monospace;margin-left:auto;}
.hist-delta.up{color:#4ade80;}
.hist-delta.down{color:#f87171;}
.hist-delta.flat{color:#555;}
.hist-sets-row{display:flex;gap:5px;flex-wrap:wrap;}
.hist-set-chip{font-size:10px;font-family:monospace;padding:2px 7px;background:#1a1a1a;border-radius:20px;color:#888;}
.hist-set-chip.best-chip{background:#4ade8015;color:#4ade80;}

/* INSTALL */
#install-banner{display:none;position:fixed;bottom:0;left:0;right:0;background:#111;
border-top:1px solid #1f1f1f;padding:13px 20px calc(13px + env(safe-area-inset-bottom));
z-index:100;align-items:center;gap:12px;}
#install-banner.visible{display:flex;}
#install-banner p{flex:1;font-size:13px;color:#aaa;}
#install-banner p strong{color:#4ade80;display:block;font-size:14px;margin-bottom:2px;}
.install-btn{padding:10px 16px;background:#4ade80;color:#000;border:none;border-radius:4px;
font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;}
.dismiss-btn{background:none;border:none;color:#555;font-size:20px;cursor:pointer;padding:4px;}
#ios-hint{display:none;position:fixed;bottom:0;left:0;right:0;background:#111;
border-top:1px solid #1f1f1f;padding:14px 20px calc(14px + env(safe-area-inset-bottom));
z-index:100;text-align:center;}
#ios-hint.visible{display:block;}
#ios-hint p{font-size:13px;color:#aaa;line-height:1.6;}
#ios-hint p strong{color:#4ade80;}
.close-hint{margin-top:10px;padding:7px 18px;background:transparent;border:1px solid #333;
color:#aaa;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit;}
</style>

</head>

let state={tab:"workout",phase:"phase2",day:"monday",done:{},pillar:0,log:{}};

function loadState(){

    const s=JSON.parse(localStorage.getItem("hulk_v4")||"{}");
    if(s.done)  state.done=s.done;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const today=()=>new Date().toISOString().slice(0,10);
const round25=(v)=>Math.round(v*4)/4;
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function fmtDate(ds){return new Date(ds+"T00:00:00").toLocaleDateString('en-GB',{day:'numeric',month:'short'});}

function getLog(name){return state.log[name]||[];}
function getLastSession(name){const l=getLog(name);return l.length?l[l.length-1]:null;}
function getLastWeight(name){
  const s=getLastSession(name);
  if(!s||!s.sets||!s.sets.length) return null;
  const ws=s.sets.filter(r=>!r.warmup&&r.kg);
  return ws.length?Math.max(...ws.map(r=>r.kg)):null;
}
function getTarget(name){const lw=getLastWeight(name);return lw!==null?round25(lw+2.5):null;}
function todayLogged(name){const l=getLog(name);return l.length&&l[l.length-1].date===today();}

// Init session sets for current exercise from last session or blank
function initSessionSets(ex){
  if(sessionSets[ex.name]) return; // already init this session
  const last=getLastSession(ex.name);
  const target=getTarget(ex.name);
  sessionSets[ex.name]=ex.sets.map((s,i)=>{
    const lastSet=last&&last.sets&&last.sets[i];
    // For work sets pre-fill target kg, for warmups use last warmup weight or blank
    const kg = s.warmup
      ? (lastSet&&lastSet.kg?lastSet.kg:null)
      : (target!==null?target:(lastSet&&lastSet.kg?lastSet.kg:null));
    return {kg:kg, reps:lastSet?lastSet.reps:null, done:false, warmup:!!s.warmup};
  });
}

function saveSession(name){
  if(!state.log[name]) state.log[name]=[];
  const l=state.log[name];
  const t=today();
  const entry={date:t,sets:sessionSets[name].map(s=>({kg:s.kg,reps:s.reps,done:s.done,warmup:s.warmup}))};
  if(l.length&&l[l.length-1].date===t) l[l.length-1]=entry;
  else l.push(entry);
  save();
}

function setKg(name,si,val){
  initSessionIfNeeded(name);
  sessionSets[name][si].kg=val===''?null:parseFloat(val)||null;
  saveSession(name);
}
function setReps(name,si,val){
  initSessionIfNeeded(name);
  sessionSets[name][si].reps=val===''?null:parseInt(val)||null;
  saveSession(name);
}
function tickSet(name,si){
  initSessionIfNeeded(name);
  sessionSets[name][si].done=!sessionSets[name][si].done;
  saveSession(name);
  render();
}
function initSessionIfNeeded(name){
  // find exercise across all phases/days
  for(const ph of Object.values(phases))
    for(const day of ph.days)
      for(const ex of day.exercises)
        if(ex.name===name){initSessionSets(ex);return;}
}

function applyTargetToAll(name){
  initSessionIfNeeded(name);
  const target=getTarget(name);
  if(target===null) return;
  sessionSets[name].forEach(s=>{if(!s.warmup) s.kg=target;});
  saveSession(name);
  render();
}

// ─── RENDER HELPERS ──────────────────────────────────────────────────────────
function checkSVG(c){return`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>`;}
function boltSVG(c){return`<svg width="12" height="12" viewBox="0 0 24 24" fill="${c}"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`;}

// ─── RENDER SET BLOCK ────────────────────────────────────────────────────────
function renderSetBlock(ex, dayColor){
  if(!ex.w || ex.sets.length===0) return '';
  initSessionSets(ex);
  const ss=sessionSets[ex.name];
  const target=getTarget(ex.name);
  const lastW=getLastWeight(ex.name);

  // Overload banner
  let banner='';
  const workSetsLogged=ss.filter(s=>!s.warmup&&s.kg!==null).length;
  if(target!==null && workSetsLogged===0){
    banner=`<div class="overload-suggest">
      <span style="font-size:14px">⚡</span>
      <div class="os-text"><strong>${target}kg target</strong>+2.5kg from last: ${lastW}kg</div>
      <button class="os-apply" onclick="applyTargetToAll('${esc(ex.name)}')">Fill all</button>
    </div>`;
  }

  // Set rows
  let workN=0;
  const rows=ss.map((s,i)=>{
    const isWarmup=s.warmup;
    if(!isWarmup) workN++;
    const label=isWarmup?`W${ss.slice(0,i).filter(x=>x.warmup).length+1}`:`${workN}`;
    const isDone=s.done;
    return `<div class="set-row ${isDone?'complete':''}" id="sr-${esc(ex.name)}-${i}">
      <div class="set-num ${isWarmup?'wm':''}">${label}</div>
      <input class="kg-input ${isDone?'done':''}" type="number" inputmode="decimal" step="0.5" min="0"
        placeholder="kg" value="${s.kg!==null?s.kg:''}"
        onchange="setKg('${esc(ex.name)}',${i},this.value)"
        onclick="event.stopPropagation()"
        style="border-color:${isDone?dayColor+'50':''}"/>
      <input class="reps-input ${isDone?'done':''}" type="number" inputmode="numeric" step="1" min="0"
        placeholder="reps" value="${s.reps!==null?s.reps:''}"
        onchange="setReps('${esc(ex.name)}',${i},this.value)"
        onclick="event.stopPropagation()"
        style="border-color:${isDone?dayColor+'50':''}"/>
      <button class="set-tick ${isDone?'done':''}" onclick="tickSet('${esc(ex.name)}',${i})"
        style="${isDone?`background:${dayColor}20;border-color:${dayColor}60;color:${dayColor}`:''}">
        ${isDone?'✓':'○'}
      </button>
    </div>`;
  }).join('');

  // Summary of completed sets
  const doneWork=ss.filter(s=>!s.warmup&&s.done&&s.kg&&s.reps);
  let summary='';
  if(doneWork.length){
    const bestVol=doneWork.reduce((best,s)=>(!best||s.kg*s.reps>best.kg*best.reps)?s:best,null);
    const chips=doneWork.map(s=>{
      const isBest=s===bestVol;
      return `<span class="ss-chip ${isBest?'best':''}">${s.kg}kg×${s.reps}</span>`;
    }).join('');
    summary=`<div class="sets-summary">${chips}</div>`;
  }

  return `${banner}<div class="sets-block">
    <div class="sets-header-row">
      <div class="sh-set">SET</div>
      <div class="sh-kg">KG</div>
      <div class="sh-reps">REPS</div>
      <div class="sh-done"></div>
    </div>
    ${rows}
    ${summary}
  </div>`;
}

// ─── RENDER: WORKOUT ─────────────────────────────────────────────────────────
function renderWorkout(){
  const phase=phases[state.phase];
  const days=phase.days;
  const day=days.find(d=>d.id===state.day)||days[0];

  const doneCt=day.exercises.filter((_,i)=>state.done[`${day.id}-${i}`]).length;
  const total=day.exercises.length;
  const pct=Math.round((doneCt/total)*100);

  const phaseHTML=`<div class="phase-toggle">${Object.entries(phases).map(([k,p])=>`
    <button class="phase-btn ${state.phase===k?'active':''}" onclick="setPhase('${k}')">
      <div class="pb-label">${p.label}</div><div class="pb-weeks">${p.weeks}</div><div class="pb-sub">${p.subtitle}</div>
    </button>`).join('')}</div>`;

  const tabHTML=`<div class="day-tabs">${days.map(d=>`
    <button class="day-tab" style="background:${state.day===d.id?d.color:'transparent'};color:${state.day===d.id?'#000':'#555'};border-color:${state.day===d.id?d.color:'#2a2a2a'}" onclick="setDay('${d.id}')">
      ${d.label.split(' / ')[0]}
    </button>`).join('')}</div>`;

  const exercisesHTML=day.exercises.map((ex,i)=>{
    const key=`${day.id}-${i}`;
    const isDone=!!state.done[key];
    const setBlock=renderSetBlock(ex,day.color);

    // exercise label — show set count
    const workSets=ex.sets.filter(s=>!s.warmup).length;
    const warmSets=ex.sets.filter(s=>s.warmup).length;
    let setsLabel='';
    if(ex.sets.length===0) setsLabel='';
    else if(warmSets>0) setsLabel=`${warmSets}W + ${workSets} sets`;
    else setsLabel=`${workSets} sets`;

    return `<div class="exercise-wrap">
      <button class="exercise-row ${isDone?'done':''}" style="${isDone?`background:${day.color}0d`:''}" onclick="toggleEx('${day.id}',${i})">
        <div class="ex-check" style="color:${isDone?day.color:'#2a2a2a'}">${checkSVG(isDone?day.color:'#2a2a2a')}</div>
        <div style="flex:1;min-width:0">
          <div class="ex-name ${isDone?'done':''}">${ex.name}</div>
          ${ex.note?`<div class="ex-note">${ex.note}</div>`:''}
        </div>
        <div class="ex-sets-label ${isDone?'done':''}" style="color:${day.color}">${setsLabel}</div>
      </button>
      ${setBlock}
    </div>`;
  }).join('');

  const condHTML=day.conditioning?`<div class="conditioning-block" style="border:1px solid ${day.color}30">
    <div class="cond-header">${boltSVG(day.color)}<span class="cond-label" style="color:${day.color};margin-left:5px">Conditioning</span></div>
    <div class="cond-title">${day.conditioning.title}</div>
    ${day.conditioning.items.map(item=>`<div class="cond-item" style="border-left:2px solid ${day.color}40">${item}</div>`).join('')}
  </div>`:'';

  const dayHTML=`<div class="day-card">
    <div class="day-header" style="background:linear-gradient(135deg,${day.color}12 0%,transparent 60%)">
      <div class="day-header-inner">
        <div>
          <div class="day-label">${day.label}</div>
          <div class="day-title">${day.title}</div>
          <div class="day-tag" style="color:${day.color}">${day.tag}</div>
        </div>
        <div class="progress-ring-wrap">
          <div class="progress-ring" style="background:conic-gradient(${day.color} ${pct*3.6}deg,#1f1f1f 0deg)">
            <div class="progress-ring-inner" style="color:${pct===100?day.color:'#fff'}">${pct}%</div>
          </div>
          <div class="progress-ring-count">${doneCt}/${total}</div>
        </div>
      </div>
    </div>
    <div class="exercise-list">${exercisesHTML}</div>
    ${condHTML}
  </div>`;

  const p=pillars[state.pillar];
  const pillarsHTML=`<div class="pillars-section">
    <div class="pillars-eyebrow">Beast Growth Pillars</div>
    <div class="pillar-tabs">${pillars.map((pl,i)=>`
      <button class="pillar-tab" style="background:${state.pillar===i?pl.color:'transparent'};color:${state.pillar===i?'#000':'#555'};border-color:${state.pillar===i?pl.color:'#2a2a2a'}" onclick="setPillar(${i})">${pl.icon}</button>`).join('')}
    </div>
    <div class="pillar-card" style="border-left:3px solid ${p.color}">
      <div class="pillar-card-title">${p.icon} ${p.title}</div>
      ${p.items.map(item=>`<div class="pillar-item"><div class="pillar-dot" style="color:${p.color}">◆</div><div class="pillar-text">${item}</div></div>`).join('')}
    </div>
  </div>`;

  const overloadHTML=`<div class="overload-bar">
    <span class="overload-icon">⚡</span>
    <div><div class="overload-title">PROGRESSIVE OVERLOAD RULE</div>
    <div class="overload-sub">Every week: +2.5kg · or +1 rep · or −10s rest. Pick one. Always move forward.</div></div>
  </div>`;

  document.getElementById("scroll-body").innerHTML=phaseHTML+tabHTML+dayHTML+pillarsHTML+overloadHTML;
}

// ─── RENDER: HISTORY ─────────────────────────────────────────────────────────
function renderHistory(){
  const log=state.log;
  const names=Object.keys(log).filter(k=>log[k].length>0);
  if(!names.length){
    document.getElementById("scroll-body").innerHTML=`
      <div class="history-header"><div class="history-title">Session History</div>
      <div class="history-sub">Every set, every rep, every session.</div></div>
      <div class="history-empty"><span>🏋️</span>No sessions logged yet.<br/>Head to a workout and complete some sets.</div>`;
    return;
  }

  names.sort((a,b)=>log[b].slice(-1)[0].date.localeCompare(log[a].slice(-1)[0].date));

  const cards=names.map(name=>{
    const entries=[...log[name]].sort((a,b)=>a.date.localeCompare(b.date));
    const latest=entries[entries.length-1];
    const latestW=getLastWeight(name);
    const target=latestW!==null?round25(latestW+2.5):null;

    // Sparkline by best weight per session
    const spark=entries.slice(-6).map(e=>{
      const ws=(e.sets||[]).filter(s=>!s.warmup&&s.kg);
      return ws.length?Math.max(...ws.map(s=>s.kg)):0;
    });
    const maxW=Math.max(...spark,1);
    const minW=Math.min(...spark.filter(v=>v>0),0);
    const sparkHTML=spark.length>1?`<div class="hist-chart">${spark.map((v,i)=>{
      const h=v>0?Math.max(10,((v-minW)/(maxW-minW||1))*100):6;
      return `<div class="hist-bar-wrap"><div class="hist-bar" style="height:${h}%;background:${i===spark.length-1?'#4ade80':'#2a2a2a'};width:100%"></div></div>`;
    }).join('')}</div>`:'';

    // Recent entries (last 4, newest first)
    const recent=entries.slice(-4).reverse();
    const entryRows=recent.map((e,idx)=>{
      const workSets=(e.sets||[]).filter(s=>!s.warmup&&s.kg&&s.reps);
      const prevE=idx<recent.length-1?recent[idx+1]:null;
      const prevW=prevE?(prevE.sets||[]).filter(s=>!s.warmup&&s.kg).reduce((m,s)=>Math.max(m,s.kg),0):null;
      const curW=workSets.reduce((m,s)=>Math.max(m,s.kg),0);
      let delta='';
      if(prevW!==null&&curW>0){
        const d=round25(curW-prevW);
        if(d>0) delta=`<span class="hist-delta up">+${d}kg ↑</span>`;
        else if(d<0) delta=`<span class="hist-delta down">${d}kg ↓</span>`;
        else delta=`<span class="hist-delta flat">→</span>`;
      }
      const bestVol=workSets.length?workSets.reduce((b,s)=>s.kg*s.reps>b.kg*b.reps?s:b):null;
      const chips=workSets.map(s=>{
        const isBest=bestVol&&s.kg===bestVol.kg&&s.reps===bestVol.reps;
        return `<span class="hist-set-chip ${isBest?'best-chip':''}">${s.kg}×${s.reps}</span>`;
      }).join('');
      return `<div class="hist-entry">
        <div class="hist-entry-head">
          <span class="hist-date">${fmtDate(e.date)}</span>
          <span class="hist-weight-val" style="color:${idx===0?'#fff':'#777'}">${curW?curW+'kg':'—'}</span>
          ${delta}
        </div>
        ${chips?`<div class="hist-sets-row">${chips}</div>`:''}
      </div>`;
    }).join('');

    return `<div class="hist-card">
      <div class="hist-card-head">
        <div>
          <div class="hist-ex-name">${name}</div>
          <div class="hist-sessions">${entries.length} session${entries.length>1?'s':''}</div>
        </div>
        ${target!==null?`<div class="hist-target">
          <div class="hist-target-label">Next target</div>
          <div class="hist-target-val">${target}kg</div>
          <div class="hist-target-note">+2.5kg overload</div>
        </div>`:''}
      </div>
      ${sparkHTML}
      <div class="hist-entries">${entryRows}${entries.length>4?`<div style="font-size:11px;color:#444;font-family:monospace;padding:8px 14px">+${entries.length-4} earlier sessions</div>`:''}</div>
    </div>`;
  }).join('');

  document.getElementById("scroll-body").innerHTML=`
    <div class="history-header">
      <div class="history-title">Session History</div>
      <div class="history-sub">Every set logged · Auto progressive overload targets</div>
    </div>${cards}`;
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function render(){state.tab==="workout"?renderWorkout():renderHistory();}

function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
  render();
}
function setPhase(k){state.phase=k;state.day=phases[k].days[0].id;save();render();}
function setDay(id){state.day=id;render();}
function toggleEx(dayId,i){const k=`${dayId}-${i}`;state.done[k]=!state.done[k];save();render();}
function setPillar(i){state.pillar=i;render();}

// ─── INSTALL ──────────────────────────────────────────────────────────────────
let deferredPrompt=null;
const banner=document.getElementById('install-banner');
const iosHint=document.getElementById('ios-hint');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!localStorage.getItem('hulk_inst')) banner.classList.add('visible');});
document.getElementById('install-btn').addEventListener('click',async()=>{if(!deferredPrompt) return;deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;if(outcome==='accepted') localStorage.setItem('hulk_inst','1');banner.classList.remove('visible');deferredPrompt=null;});
document.getElementById('dismiss-btn').addEventListener('click',()=>{banner.classList.remove('visible');localStorage.setItem('hulk_inst','1');});
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(isIOS&&!window.navigator.standalone&&!localStorage.getItem('hulk_ios')) setTimeout(()=>iosHint.classList.add('visible'),2000);
document.getElementById('close-hint').addEventListener('click',()=>{iosHint.classList.remove('visible');localStorage.setItem('hulk_ios','1');});

// ─── SERVICE WORKER ───────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  const sw=`const C='hulk-v4';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k))))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadState();
render();
</script>
